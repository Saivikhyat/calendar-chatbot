<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Chatbot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    #chat-container { height: calc(100vh - 180px); }
    #chat-messages { height: 100%; overflow-y: auto; }
    .message-enter { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
  <header class="gradient-bg shadow-lg p-4">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white">Calendar Assistant</h1>
          <p class="text-xs text-white/70">Powered by Groq AI</p>
        </div>
      </div>
      <div id="auth-status"></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col max-w-2xl mx-auto w-full p-4">
    <div id="chat-container" class="bg-gray-900 rounded-2xl shadow-2xl border border-gray-800 overflow-hidden flex flex-col">
      <div id="chat-messages" class="flex-1 p-4 space-y-4">
        <div class="text-center text-gray-500 py-12" id="welcome-msg">
          <div class="w-16 h-16 bg-purple-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
          </div>
          <p class="text-lg font-medium text-gray-300">Welcome to Calendar Assistant</p>
          <p class="text-sm text-gray-500 mt-2">Connect your Google Calendar to get started</p>
          <div class="mt-6 space-y-2 text-sm text-gray-600">
            <p>"What's on my schedule today?"</p>
            <p>"Create a meeting tomorrow at 3pm"</p>
            <p>"Delete my 2pm meeting"</p>
          </div>
        </div>
      </div>
      <div class="p-4 border-t border-gray-800 bg-gray-900/50 backdrop-blur-sm">
        <form id="chat-form" class="flex gap-3">
          <input
            type="text"
            id="message-input"
            placeholder="Ask about your calendar..."
            class="flex-1 bg-gray-800 text-white rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 border border-gray-700 transition-all placeholder-gray-500"
            autocomplete="off"
          />
          <button
            type="submit"
            class="gradient-bg text-white px-5 py-3 rounded-xl font-medium transition-all hover:opacity-90 disabled:opacity-50 flex items-center gap-2"
            id="send-btn"
          >
            <span>Send</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </main>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const authStatus = document.getElementById('auth-status');
    const welcomeMsg = document.getElementById('welcome-msg');

    let authenticated = false;

    async function checkAuth() {
      try {
        const res = await fetch('/auth/status');
        const data = await res.json();
        authenticated = data.authenticated;
        if (authenticated) {
          authStatus.innerHTML = '<span class="text-green-400 text-sm flex items-center gap-1"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>Connected</span>';
          if (welcomeMsg) {
            welcomeMsg.innerHTML = `
              <div class="w-16 h-16 bg-green-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
              </div>
              <p class="text-lg font-medium text-gray-300">Connected to Google Calendar</p>
              <p class="text-sm text-gray-500 mt-2">Ask me anything about your schedule!</p>
            `;
          }
        } else {
          authStatus.innerHTML = '<a href="/auth/login" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg text-sm transition-all backdrop-blur-sm flex items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>Connect Calendar</a>';
          messageInput.disabled = true;
          sendBtn.disabled = true;
          messageInput.placeholder = 'Connect Google Calendar first...';
        }
      } catch (error) {
        authStatus.innerHTML = '<span class="text-red-400 text-sm">Error</span>';
      }
    }

    function addMessage(content, isUser) {
      const div = document.createElement('div');
      div.className = `message-enter flex ${isUser ? 'justify-end' : 'justify-start'}`;
      
      const avatar = isUser 
        ? '<div class="w-8 h-8 bg-blue-500/20 rounded-lg flex items-center justify-center flex-shrink-0 ml-2"><svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>'
        : '<div class="w-8 h-8 bg-purple-500/20 rounded-lg flex items-center justify-center flex-shrink-0 mr-2"><svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>';

      div.innerHTML = `
        ${isUser ? '' : avatar}
        <div class="${isUser ? 'bg-purple-600 text-white' : 'bg-gray-800 text-gray-100'} rounded-2xl px-4 py-3 max-w-[75%] shadow-lg ${isUser ? 'rounded-br-md' : 'rounded-bl-md'}">
          <p class="whitespace-pre-wrap text-sm leading-relaxed">${escapeHtml(content)}</p>
        </div>
        ${isUser ? avatar : ''}
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addLoading() {
      const div = document.createElement('div');
      div.id = 'loading';
      div.className = 'message-enter flex justify-start';
      div.innerHTML = `
        <div class="w-8 h-8 bg-purple-500/20 rounded-lg flex items-center justify-center flex-shrink-0 mr-2">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div class="bg-gray-800 rounded-2xl rounded-bl-md px-4 py-3 shadow-lg">
          <div class="flex space-x-1.5">
            <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-purple-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
          </div>
        </div>
      `;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoading() {
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;

      addMessage(message, true);
      messageInput.value = '';
      addLoading();
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        removeLoading();

        if (data.authUrl) {
          window.location.href = data.authUrl;
          return;
        }

        addMessage(data.reply || data.error || 'No response', false);
      } catch (error) {
        removeLoading();
        addMessage('Failed to connect to the server', false);
      } finally {
        sendBtn.disabled = false;
      }
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        chatForm.dispatchEvent(new Event('submit'));
      }
    });

    checkAuth();
  </script>
</body>
</html>
